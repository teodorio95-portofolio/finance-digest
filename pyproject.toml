[project]
name = "finance-digest"
version = "0.1.0"
description = "Daily email digest for a euro saver in Romania: BNR rates, global ETFs, Fidelis and EUR deposits"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "jinja2>=3.1",
    "css-inline>=0.14",
]

[project.scripts]
finance = "finance.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# the email prints a real minus sign and en dashes on purpose (Romanian typography)
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

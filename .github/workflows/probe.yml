# Phase 0: fetch every source from a GitHub runner IP, parse it, and report what came back.
# The raw bodies are uploaded as a 3-day artifact to build parser fixtures from.
name: probe

on:
  workflow_dispatch:
  push:
    branches: ["feat/**"]
    paths: [".github/workflows/probe.yml", "scripts/probe.py", "src/finance/sources.py"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Probe sources
        run: uv run python scripts/probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-out
          path: probe-out/
          retention-days: 3
